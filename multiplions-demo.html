<html lang="fr">
<head>
<meta charset="utf-8">

<meta name="description" content="Multiplions ! : application d’entraînement aux tables de multiplication pour les enfants. Sans compte, sans publicité, hors connexion.">

<style>
@font-face{font-family:'Fredoka';font-style:normal;font-weight:300 700;font-display:swap;src:local('Fredoka'),local('Fredoka Medium')}
@font-face{font-family:'Nunito';font-style:normal;font-weight:200 1000;font-display:swap;src:local('Nunito')}
/* Layout: one narrow column, phone first. The setup screen scrolls with a sticky start bar; the session screen is a chunky equation card above a big keypad. Each table 1-10 has its own hue, reused on chips, equations and the stats grid. */
:root{
  --bpt:calc(10px + env(safe-area-inset-top,0px));
  --bg:#F3F1FF; --surface:#FFFFFF; --surface-2:#E9E6FF; --ink:#211B58; --ink-soft:#5A5688; --line:#D6D1F4;
  --primary:#5A3CF0; --primary-deep:#3B22B8; --on-primary:#FFFFFF; --primary-tint:#E4DEFF;
  --accent:#FF8A1F; --accent-bg:#FFEBD6;
  --good:#0B7F3F; --good-bg:#D7F4E2; --bad:#C92F3C; --bad-bg:#FFE0E0;
  --focus:#2A6BFF; --brain:#FBF9FF;
  --chip-s:92%; --chip-bg-l:86%; --chip-bd-l:52%; --num-l:40%; --num-l8:40%; --dk:0;
  --rk-s:72%; --rk-l:68%; --rk-ring-l:40%; --gold:#FFD04A; --silver:#D3D8E8; --bronze:#EBA46E;
  --lv-new:#EFEDFF; --lv-low:#FFC7C2; --lv-mid:#FFDFA6; --lv-high:#E1F0A6; --lv-top:#93E4B2;
  --f-display:'Fredoka','Arial Rounded MT Bold',ui-rounded,'Nunito',system-ui,sans-serif;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14123A; --surface:#1F1C52; --surface-2:#2B2770; --ink:#F1EFFF; --ink-soft:#B5B0EC; --line:#3C3790;
    --primary:#9C8BFF; --primary-deep:#6A57E0; --on-primary:#14123A; --primary-tint:#34308A;
    --accent:#FFA24A; --accent-bg:#4A3416;
    --good:#6FE8A3; --good-bg:#14452E; --bad:#FF8D8D; --bad-bg:#4F1F2D;
    --focus:#8FB4FF; --brain:#2A2670;
    --chip-s:60%; --chip-bg-l:30%; --chip-bd-l:62%; --num-l:72%; --num-l8:78%; --dk:1; --rk-s:55%; --rk-l:36%; --rk-ring-l:72%; --gold:#866700; --silver:#4C5278; --bronze:#7A4A28;
    --lv-new:#27235F; --lv-low:#7A2A3A; --lv-mid:#7A5516; --lv-high:#566A1A; --lv-top:#1D7048;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14123A; --surface:#1F1C52; --surface-2:#2B2770; --ink:#F1EFFF; --ink-soft:#B5B0EC; --line:#3C3790;
  --primary:#9C8BFF; --primary-deep:#6A57E0; --on-primary:#14123A; --primary-tint:#34308A;
  --accent:#FFA24A; --accent-bg:#4A3416;
  --good:#6FE8A3; --good-bg:#14452E; --bad:#FF8D8D; --bad-bg:#4F1F2D;
  --focus:#8FB4FF; --brain:#2A2670;
  --chip-s:60%; --chip-bg-l:30%; --chip-bd-l:62%; --num-l:72%; --num-l8:78%; --dk:1; --rk-s:55%; --rk-l:36%; --rk-ring-l:72%; --gold:#866700; --silver:#4C5278; --bronze:#7A4A28;
  --lv-new:#27235F; --lv-low:#7A2A3A; --lv-mid:#7A5516; --lv-high:#566A1A; --lv-top:#1D7048;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;scroll-padding-top:calc(var(--bpt) + 64px)}
button{-webkit-user-select:none;user-select:none}
[inert]{pointer-events:none}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;padding-top:var(--bpt);padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));overscroll-behavior-y:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
.app{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1[tabindex="-1"]:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.25rem}
/* Bandeau du haut : collé en haut de l'écran pendant le défilement (la classe « top » sert aussi à des paragraphes d'aide). */
header.top{padding:calc(var(--bpt) + 6px) 0 14px;margin-top:calc(-1 * var(--bpt));position:sticky;top:0;z-index:20;background:var(--bg)}
header.top.stuck{box-shadow:0 8px 10px -8px rgba(20,18,58,.38)}
/* Téléphone en paysage : bandeau compact pour garder de la place au contenu. */
@media (orientation:landscape) and (max-height:500px){
  html{scroll-padding-top:calc(var(--bpt) + 38px)}
  header.top{padding:calc(var(--bpt) - 6px) 0 6px}
  header.top .iconbtn,header.top .topback{height:38px}
  header.top .iconbtn{width:38px;border-radius:12px}
  header.top .iconbtn svg{width:20px;height:20px}
  header.top .topback{padding:0 12px 0 8px;border-radius:12px}
  header.top .brand{font-size:1.1rem}
  header.top .brand svg{width:28px;height:28px}
}
.brand svg{width:34px;height:34px;display:block}
.mk-bg{fill:var(--primary)}
.mk-x{stroke:var(--on-primary)}
.iconbtn.on{background:var(--accent-bg);border-color:var(--accent)}
.igroup{margin:18px 0 8px;color:var(--ink-soft);font-weight:800;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
.ilist{display:grid;border:2px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden}
.irow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:54px;padding:0 16px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:1.05rem;text-align:left}
.irow:last-child{border-bottom:0}
.irow:active{background:var(--surface-2)}
.irow svg{width:20px;height:20px;flex:none;stroke:var(--ink-soft);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.irow small{font-family:var(--f-body);font-weight:700;color:var(--ink-soft);font-size:.78rem;margin-left:auto}
.prose h2{margin:20px 0 6px;font-size:1.05rem}
.prose p,.prose li{color:var(--ink);font-weight:600;font-size:.95rem;line-height:1.5}
.prose p{margin:0 0 8px}
.prose ul{margin:0 0 8px;padding-left:20px}
.prose .upd{color:var(--ink-soft);font-weight:700;font-size:.82rem}
.faq details{border-bottom:1px solid var(--line);padding:2px 0}
.faq details:last-of-type{border-bottom:0}
.faq.main>details.fmain{border-bottom:0}
.faq.main>details.fmain>summary{font-size:1.2rem;font-weight:700}
.faq.main .fin{padding-top:2px}
.faq .fin p.mut{font-size:.9rem;font-weight:600}
.faq summary{cursor:pointer;min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--f-display);font-weight:600;font-size:1rem;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";flex:none;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;background:var(--primary-tint);color:var(--ink);font-weight:700;font-size:1.1rem;line-height:1}
.faq details[open]>summary::after{content:"−"}
.faq details p{margin:0 0 12px;color:var(--ink);font-weight:600;font-size:.93rem;line-height:1.5}
/* Écrans « Leçons », « Astuces » et « Conseils » : une liste, un tiroir déroulant par entrée, une icône par entrée. Le bouton de l'accueil réutilise .rankbtn. */
.rankbtn+.rankbtn,.rankbtn+.rank2{margin-top:14px}
.h1l{font-family:var(--f-display);font-weight:700;font-size:clamp(1.8rem,7vw,2.3rem);line-height:1.1;margin:28px 0 14px;text-wrap:balance}
/* Grille 2 × 2 (Leçons, Révisions / Astuces, Conseils) : icône au-dessus du libellé. */
.rvcards{display:grid;gap:14px}
.rvcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border-radius:24px;border:3px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:0 5px 0 var(--line);cursor:pointer;font-family:inherit}
.rvcard:active{transform:translateY(5px);box-shadow:0 0 0 var(--line)}
.rvic{flex:none;width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:hsl(var(--h) var(--chip-s) var(--chip-bg-l))}
.rvic svg{width:32px;height:32px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.rvt{min-width:0}
.rvt b{display:block;font-family:var(--f-display);font-size:1.3rem;line-height:1.15}
.rvt small{display:block;font-weight:700;font-size:.88rem;color:var(--ink-soft);margin-top:3px}
.orhead{position:sticky;top:0;z-index:20;margin-top:calc(-1 * var(--bpt,0px));padding:calc(var(--bpt,0px) + 6px) 0 8px;background:var(--bg);display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 10px}
.orhead .count{text-align:left;font-weight:800}
.orhead .prog{grid-column:1/-1}
.orleg{display:flex;flex-wrap:wrap;gap:4px 12px;margin:6px 0 10px;font-size:.78rem;font-weight:800}
.orleg>span{display:inline-flex;align-items:center;gap:4px}
.orleg svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
ol.orl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.orr{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px;padding:6px;border-radius:16px;border:2px solid var(--line);background:var(--surface)}
.orr.done{background:var(--surface-2)}
.orq{display:flex;align-items:baseline;gap:.18em;white-space:nowrap;font-family:var(--f-display,inherit);font-weight:700;font-size:clamp(14.7px,calc((100vw - 215px)/7),21px);min-width:0}
.orq .x,.orq .e{color:var(--ink-soft);font-weight:600}
.orq b{font-weight:700;background:var(--accent-bg);color:var(--ink);border-radius:8px;padding:0 4px}
.orbs{display:grid;grid-template-columns:repeat(4,38px);gap:3px}
.orx{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;cursor:pointer}
.orx svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:.5}
.orx[aria-pressed="true"] svg{opacity:1}
.orx[data-v="1"]{color:var(--good)}.orx[data-v="2"]{color:var(--accent)}.orx[data-v="3"]{color:var(--bad)}.orx[data-v="4"]{color:var(--ink-soft)}
.orx[data-v="1"][aria-pressed="true"]{background:var(--good-bg);border-color:var(--good)}
.orx[data-v="2"][aria-pressed="true"]{background:var(--accent-bg);border-color:var(--accent)}
.orx[data-v="3"][aria-pressed="true"]{background:var(--bad-bg);border-color:var(--bad)}
.orx[data-v="4"][aria-pressed="true"]{background:var(--surface-2);border-color:var(--ink-soft)}
.orx:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.ormore{margin-top:14px}
.seg.c3.modes{grid-template-columns:repeat(6,minmax(0,1fr))}
.seg.modes .opt{grid-column:span 2}
.seg.modes .opt.half{grid-column:span 3}
.tchip:disabled{opacity:.3;cursor:not-allowed}
.bnbar{display:flex;align-items:center;gap:6px;margin:0 0 8px}
.bnbar h1{margin:0;flex:1;min-width:0;font-size:.95rem;line-height:1.15}
.bnbar .btn{padding:0 12px}
.bnst{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:3px 6px;font-weight:800;min-width:50px;text-align:center;line-height:1.2}
.bnst small{display:block;font-weight:600;color:var(--ink-soft);font-size:.68rem}
.bnst.low b{color:var(--bad)}
.bnsky{position:relative;overflow:hidden;height:calc(100dvh - 120px);min-height:340px;border:2px solid var(--line);border-radius:18px;background:linear-gradient(var(--surface-2),var(--surface));touch-action:manipulation;user-select:none;-webkit-user-select:none}
.bn{position:absolute;left:0;top:0;width:var(--s);height:calc(var(--s)*1.18);border:0;padding:0;background:none;will-change:transform;cursor:pointer}
.bnb{position:absolute;inset:0 0 14% 0;border-radius:50% 50% 48% 48%;background:radial-gradient(circle at 32% 28%,hsl(var(--h) 90% 82%),hsl(var(--h) 75% 56%) 62%,hsl(var(--h) 70% 44%));box-shadow:inset -4px -6px 10px rgba(0,0,0,.18);display:grid;place-items:center;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55);font:800 calc(var(--s)*.38)/1 var(--f-display,inherit)}
.bnb:after{content:"";position:absolute;bottom:-5px;left:calc(50% - 5px);border:5px solid transparent;border-bottom-color:hsl(var(--h) 70% 44%);border-top:0}
.bn.pop .bnb{animation:bnpop .22s ease-out forwards}
.bn.ko .bnb{animation:bnko .35s ease-out forwards}
@keyframes bnpop{to{transform:scale(1.6);opacity:0}}
@keyframes bnko{0%{transform:scale(1)}30%{transform:scale(1.2) rotate(-8deg);filter:grayscale(1)}100%{transform:scale(.2);opacity:0}}
.bnfl{position:absolute;font-weight:800;font-size:1.3rem;pointer-events:none;animation:bnfl .7s ease-out forwards}
.bnfl.g{color:var(--good)}.bnfl.r{color:var(--bad)}
@keyframes bnfl{to{transform:translateY(-40px);opacity:0}}
.bnres b.big{display:block;font-size:3rem;color:var(--primary);line-height:1.1}
.bnrow{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line)}.bnrow:first-child{border-top:0}
.lbtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 6px}
.lbtop h1{margin:0;font-size:1.25rem}
.lbhint{margin:0 0 10px;font-size:.9rem;color:var(--ink-soft);min-height:2.6em}
.lbgrid{display:grid;grid-template-columns:repeat(var(--lc),var(--cs));gap:4px;justify-content:center;margin:0 auto}
.lbtag{font-size:.7rem;font-weight:800;color:var(--ink-soft);text-align:center;line-height:1.1;padding:2px 0}
.lbtag.on{color:var(--primary)}
.lcell{width:var(--cs);height:var(--cs);border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:700 calc(var(--cs)*.38)/1 var(--f-display,inherit);display:grid;place-items:center;padding:0;cursor:pointer;position:relative}
.lcell.st,.lcell.en{border-color:var(--primary)}
.lcell.in{background:hsl(var(--h) var(--chip-s) var(--chip-bg-l));border-color:hsl(var(--h) 75% var(--chip-bd-l))}
.lcell.cur{box-shadow:0 0 0 3px hsl(var(--h) 70% var(--chip-bd-l))}
.lcell.bad{background:var(--bad-bg);border-color:var(--bad);animation:lbshake .35s}
@keyframes lbshake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@media (prefers-reduced-motion:reduce){.lcell.bad{animation:none}}
.lcell:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.lbres{text-align:center}
.lbres b{display:block;font-size:2rem;margin:6px 0}
.wrs{display:grid;gap:14px;margin-top:14px}
.wrp{background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.18);overflow:hidden;line-height:0}
.wrp svg{display:block;width:100%;height:auto}
.wtype{font-family:var(--f-display,inherit);font-weight:700;white-space:nowrap}
.wtitle{margin-top:0}
.orx[data-v="0"]{color:var(--primary)}
.orx[data-v="0"] span{font-size:.64rem;font-weight:800;line-height:1;letter-spacing:-.02em;color:var(--ink)}
.orx[data-v="0"].run{background:var(--accent-bg);border-color:var(--accent)}
.orx[data-v="0"].run svg{opacity:1;color:var(--accent)}
.orx[data-v="0"].stp{border-color:var(--primary)}
.orx[data-v="0"].stp svg{display:none}
.orx:disabled{opacity:.35;cursor:not-allowed}
.ortl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 14px}
.ortl div{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 2px;text-align:center}
.ortl b{display:block;font-family:var(--f-display);font-size:1.6rem;line-height:1.1}
.ortl span{display:block;font-size:.72rem;font-weight:800;color:var(--ink-soft)}
.ortl .good b{color:var(--good)}.ortl .bad b{color:var(--bad)}
.rank2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.rank2 .rankbtn{margin-top:0;flex-direction:column;gap:6px;min-height:96px;font-size:1.3rem;padding:8px 6px}.rankbtn span{text-align:center}
.astl{display:grid;border:2px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden}
.asti{border-bottom:1px solid var(--line)}
.asti:last-child{border-bottom:0}
.asti summary{cursor:pointer;min-height:64px;display:flex;align-items:center;gap:12px;padding:8px 14px;list-style:none}
.asti summary::-webkit-details-marker{display:none}
.asti summary:active{background:var(--surface-2)}
.asti summary::after{content:"+";margin-left:auto;flex:none;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;background:var(--primary-tint);color:var(--ink);font-weight:700;font-size:1.1rem;line-height:1}
.asti[open] summary::after{content:"−"}
.asti-ic{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:hsl(var(--h) var(--chip-s) var(--chip-bg-l));border:2px solid hsl(var(--h) 75% var(--chip-bd-l));color:var(--ink)}
.asti-ic svg{width:28px;height:28px;display:block}
.asti-t{display:flex;flex-direction:column;min-width:0;font-family:var(--f-display);font-weight:600;font-size:1.05rem;line-height:1.2}
.asti-t small{font-family:var(--f-body);font-weight:800;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft)}
.asti-b{padding:2px 16px 16px;font-weight:600;font-size:.95rem;line-height:1.5}
.asti-b p{margin:0 0 8px}
.asti-b ol{margin:0 0 10px;padding-left:20px}
.asti-b ol li{margin:0 0 6px}
.asti-eq{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:6px}
.asti-eq li{font-family:var(--f-display);font-weight:700;font-size:1.2rem;background:var(--surface-2);border-radius:12px;padding:6px 12px;font-variant-numeric:tabular-nums}
.asti-eq2{list-style:none;margin:0 0 10px;padding:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.asti-eq2 li{font-family:var(--f-display);font-weight:700;font-size:1.1rem;white-space:nowrap;text-align:center;background:var(--surface-2);border-radius:12px;padding:8px 4px;font-variant-numeric:tabular-nums}
.asti-eq2 b{font-weight:700}
/* Briques de la table de 1, sous les cadres gris, sur le fond du tiroir. Une cellule = un carré --s ; la rangée de 10 cellules occupe toute la largeur d'une colonne. */
.asti-eq2.brw{margin-top:-2px;position:relative}
.pgg{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:2px;max-width:360px;margin:10px auto 6px}
.pgg>*{aspect-ratio:1;display:grid;place-items:center;border-radius:4px;font-family:var(--f-display);font-weight:800;font-size:min(.7rem,2.6vw);font-style:normal;line-height:1;font-variant-numeric:tabular-nums}
.pgg .pgh{color:var(--ink-soft)}
.pgc{border:1px solid var(--line);color:transparent}
.pgc.o{background:var(--primary-tint);border-color:transparent;color:var(--ink)}
.pgc.n{background:var(--primary);border-color:transparent;color:var(--on-primary)}

.n,.hmh.n{color:hsl(var(--h) 85% calc(var(--nl-c,40%)*(1 - var(--dk)) + var(--nl-s,72%)*var(--dk)))}
.n{font-weight:700}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:1.05rem;box-shadow:0 3px 0 var(--line);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary);box-shadow:0 4px 0 var(--primary-deep)}
.btn.primary:active:not(:disabled){box-shadow:0 0 0 var(--primary-deep)}
.btn.danger{border-color:var(--bad);color:var(--bad);box-shadow:0 3px 0 var(--bad)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none}
.btn.small{min-height:44px;padding:0 14px;font-size:.95rem}
.btn.go{width:100%;min-height:62px;font-size:1.3rem;border-radius:20px}
button.link{background:none;border:0;color:var(--primary);font-weight:800;text-decoration:underline;padding:10px 4px;min-height:44px}
.stack{display:grid;gap:10px;margin-top:14px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 16px}
.rkexp{margin-left:auto;text-align:right;white-space:nowrap;font-weight:700;color:var(--ink-soft);font-size:.9rem;line-height:1.15}

.rmst li.ko{color:var(--ink)}
.rmst li.ok{color:var(--ink-soft)}

/* Solo / Duo */
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:8px 0 10px}
.modebtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;width:100%;min-height:190px;padding:18px 10px;border-radius:28px;border:3px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--f-display);font-weight:700;font-size:2rem;text-align:center;box-shadow:0 6px 0 var(--line);transition:transform .08s,box-shadow .08s}
.modebtn:active{transform:translateY(6px);box-shadow:0 0 0 var(--line)}
.modebtn svg{width:72px;height:72px;flex:none;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.modebtn.solo{background:var(--primary);border-color:var(--primary);color:var(--on-primary);box-shadow:0 6px 0 var(--primary-deep)}
.modebtn.solo:active{box-shadow:0 0 0 var(--primary-deep)}
.modebtn.duo{border-color:var(--accent);box-shadow:0 6px 0 var(--accent)}
.modebtn.duo:active{box-shadow:0 0 0 var(--accent)}
.modebtn.duo svg{color:var(--accent)}

.rankbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:76px;margin-top:6px;border-radius:24px;border:3px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--f-display);font-weight:700;font-size:1.5rem;box-shadow:0 5px 0 var(--line);transition:transform .08s,box-shadow .08s}
.rankbtn:active{transform:translateY(5px);box-shadow:0 0 0 var(--line)}
.rankbtn svg{width:34px;height:34px;flex:none;color:var(--accent);stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
/* Très petit écran (320 px) : police réduite des boutons de l'accueil, à côté de son icône. */
@media (max-width:340px){.rankbtn{font-size:1.25rem;gap:10px}.rankbtn svg{width:30px;height:30px}}

/* Duo : choix des deux joueurs */
.duo-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);margin:6px 0 10px}
.duo-col{--sc:var(--primary);--st:var(--primary-tint);min-width:0;padding:0 10px 0 0}
.duo-col[data-side="b"]{--sc:var(--accent);--st:var(--accent-bg);padding:0 0 0 10px;border-left:3px dashed var(--line)}
.duo-h{font-family:var(--f-display);font-weight:700;font-size:1.05rem;text-align:center;margin:0 0 10px;padding:6px 8px;border-radius:12px;background:var(--st);color:var(--ink);border:2px solid var(--sc)}
.dlist{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.dp{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:6px 10px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);text-align:left}
.dp[aria-pressed="true"]{border-color:var(--sc);background:var(--st);box-shadow:inset 0 0 0 1.5px var(--sc)}
.dp[aria-pressed="true"]::after{content:"✓";margin-left:auto;color:var(--sc);font-weight:800}
.dp:disabled{opacity:.4;cursor:not-allowed}
.dp.add{border-style:dashed;color:var(--ink-soft)}
.dp .plus{display:grid;place-items:center;width:34px;height:34px;flex:none;font-size:1.6rem;font-weight:700;line-height:1}
.dpn{font-family:var(--f-display);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.av svg{width:58%;height:58%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.av.sm{width:34px;height:34px;font-size:1.1rem}
.dform{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.dp.add .dpn{white-space:normal;line-height:1.15}
.dp.edit{border-style:solid;border-color:var(--sc);background:var(--st);color:var(--ink)}
.dp.edit input[type=text]{flex:1;min-width:0;width:auto;min-height:34px;padding:0;border:0;border-radius:0;background:transparent;font-family:var(--f-display);font-weight:600;font-size:1rem}
.dp.edit input[type=text]:focus-visible{outline:none}
.dp.edit:focus-within{box-shadow:inset 0 0 0 1.5px var(--sc)}
.vs{display:flex;align-items:center;justify-content:center;gap:14px;margin:10px 0 16px}
.vs-p{display:grid;justify-items:center;gap:6px;min-width:0}
.vs-t{font-family:var(--f-display);font-weight:700;font-size:1.4rem;color:var(--ink-soft)}

/* Duo : réglages et duel */
.dmodes{display:grid;gap:10px}
.dmode{display:grid;gap:2px;width:100%;text-align:left;padding:12px 14px;border-radius:18px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.dmode b{font-family:var(--f-display);font-size:1.15rem;font-weight:600}
.dmode span{color:var(--ink-soft);font-weight:700;font-size:.88rem;line-height:1.3}
.dmode[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-tint);box-shadow:inset 0 0 0 1.5px var(--primary)}
.duel{display:grid;gap:10px}
.d-score{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.d-pl{--sc:var(--primary);--st:var(--primary-tint);display:flex;align-items:center;gap:8px;min-width:0;padding:6px 10px;border-radius:16px;border:2px solid var(--line);background:var(--surface)}
.d-pl.b{--sc:var(--accent);--st:var(--accent-bg)}
.d-pl.turn{border-color:var(--sc);background:var(--st);box-shadow:inset 0 0 0 1.5px var(--sc)}
.d-pl .dn{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--f-display);font-weight:600}
.d-pl b{font-family:var(--f-display);font-size:1.6rem;line-height:1;font-variant-numeric:tabular-nums}
.d-pl b small{font-size:.55em;color:var(--ink-soft);font-weight:700}
.d-eq{min-height:92px;padding:10px;font-size:clamp(2rem,9.5vw,3.2rem)}
.d-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(76px,.7fr) minmax(0,1fr);gap:8px 10px}
.dbtn{--sc:var(--primary);--st:var(--primary-tint);min-height:clamp(62px,11vh,92px);border-radius:20px;border:3px solid var(--sc);background:var(--st);color:var(--sc);font-size:2rem;font-weight:800;box-shadow:0 5px 0 var(--sc);padding:0;transition:transform .06s,box-shadow .06s}
.d-grid.coop{grid-template-columns:repeat(2,minmax(0,1fr))}
.dbtn.cn{font-family:var(--f-display);font-size:2.4rem;font-variant-numeric:tabular-nums}
.dbtn.cn.lock{opacity:.4}
.dbtn.cn.dim{opacity:.4;box-shadow:none;transform:translateY(5px)}
.dbtn.b{--sc:var(--accent);--st:var(--accent-bg)}
.dbtn:active:not(.lock){transform:translateY(5px);box-shadow:0 0 0 var(--sc)}
.dbtn.picked{box-shadow:inset 0 0 0 5px var(--sc)}
.dbtn.good{border-color:var(--good);background:var(--good-bg);color:var(--good);box-shadow:0 5px 0 var(--good)}
.dbtn.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);box-shadow:0 5px 0 var(--bad)}
.dbtn.lock{opacity:.35;box-shadow:none;pointer-events:none}
.dval{display:grid;place-items:center;border-radius:20px;background:var(--surface);border:3px solid var(--line);font-family:var(--f-display);font-weight:700;font-size:clamp(1.8rem,8vw,2.6rem);font-variant-numeric:tabular-nums}

.dval.good{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.drow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);text-align:center;font-family:var(--f-display);font-weight:700;font-size:1.15rem}

.drow .dl small{display:block;color:var(--ink-soft);font-weight:700;font-size:.78rem}
.d-res .d-pl{justify-content:center;flex-direction:column;padding:12px 8px;text-align:center}
.d-res .d-pl b{font-size:2.6rem}
.d-res .d-pl .dn{flex:none;max-width:100%}

/* Profiles */
/* Aides guidées : un halo autour de l'élément expliqué et une bulle avec le texte. Le halo laisse passer les touchers. */
#tutoroot{position:fixed;inset:0;z-index:70;pointer-events:none}
.tu-spot{position:fixed;border-radius:16px;box-shadow:0 0 0 9999px rgba(20,18,58,.58),0 0 0 4px var(--primary);pointer-events:none;transition:left .25s,top .25s,width .25s,height .25s}
.tu-bub{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:420px;pointer-events:auto;background:var(--surface);color:var(--ink);border:3px solid var(--primary);border-radius:20px;padding:12px 14px;box-shadow:0 5px 0 var(--primary-deep),0 10px 30px rgba(0,0,0,.3)}

.tu-bub .tu-b{display:flex;gap:8px;justify-content:flex-end}
/* Présentation (onboarding) : cartes avec une illustration animée (les animations sont coupées si l'appareil le demande, voir plus bas). */
.intro{display:flex;flex-direction:column;min-height:calc(100vh - 110px);min-height:calc(100dvh - 110px)}
.intro .skiprow{display:flex;justify-content:flex-end;min-height:44px}

.intro .dots i.on{width:26px;border-radius:6px;background:var(--primary)}
@keyframes ibob{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-6px) rotate(var(--r))}}
@keyframes ipop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes iqa{0%,35%{opacity:1}48%,88%{opacity:0}100%{opacity:1}}
@keyframes iqb{0%,35%{opacity:0}48%,88%{opacity:1}100%{opacity:0}}

@keyframes ifade{0%{width:0}45%{width:60%}85%,100%{width:0}}

@keyframes ibeat{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes islide{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
.itri{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;max-width:340px}
.icol{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.iart{height:150px;width:100%;display:flex;align-items:center;justify-content:center}
.itri .ieqs{flex-direction:column;gap:8px}
.itri .ieq{font-size:.92rem;padding:5px 7px;border-radius:13px;white-space:nowrap}
.iballs,.imaze{width:100%;height:100%;display:block}
.ibl{fill:#F2B632;stroke:#C98A12;stroke-width:1.5}
.ik{fill:#C98A12}
.ihl{fill:#fff;opacity:.45}
.inum{font:800 11px var(--f-display);fill:#fff;stroke:#8A5A00;stroke-width:2.4px;paint-order:stroke;text-anchor:middle;dominant-baseline:central}
.ib{transform-box:fill-box;transform-origin:50% 50%;animation:ibr var(--d) linear infinite;animation-delay:var(--l)}
.pa>.ib{animation-name:ibpa}
.pb>.ib{animation-name:ibpb}
.pc>.ib{animation-name:ibpc}
.iw{animation:iwob 3.1s ease-in-out infinite}
@keyframes iwob{0%,100%{transform:translateX(-1.5px)}50%{transform:translateX(1.5px)}}
@keyframes ibr{0%,50%{transform:translateY(calc(176px - var(--y)))}100%{transform:translateY(calc(-36px - var(--y)))}}
@keyframes ibpa{0%,50%{transform:translateY(calc(176px - var(--y))) scale(1);opacity:1}72.7%{transform:translateY(calc(80px - var(--y))) scale(1);opacity:1}74.7%{transform:translateY(calc(80px - var(--y))) scale(1.12);opacity:1}78%,100%{transform:translateY(calc(80px - var(--y))) scale(1.4);opacity:0}}
@keyframes ibpb{0%,50%{transform:translateY(calc(176px - var(--y))) scale(1);opacity:1}78.7%{transform:translateY(calc(54px - var(--y))) scale(1);opacity:1}80.7%{transform:translateY(calc(54px - var(--y))) scale(1.12);opacity:1}84%,100%{transform:translateY(calc(54px - var(--y))) scale(1.4);opacity:0}}
@keyframes ibpc{0%,50%{transform:translateY(calc(176px - var(--y))) scale(1);opacity:1}84.5%{transform:translateY(calc(30px - var(--y))) scale(1);opacity:1}86.5%{transform:translateY(calc(30px - var(--y))) scale(1.12);opacity:1}90%,100%{transform:translateY(calc(30px - var(--y))) scale(1.4);opacity:0}}
.ibt{opacity:0;font:800 13px var(--f-display);text-anchor:middle;paint-order:stroke;stroke:var(--surface);stroke-width:3px;animation:ibta var(--d) linear infinite;animation-delay:var(--l)}
.ibt.ok{fill:var(--good)}.ibt.ko{fill:var(--bad)}
.ibt.tb{animation-name:ibtb}.ibt.tc{animation-name:ibtc}
@keyframes ibta{0%,72.7%{opacity:0;transform:translateY(0)}74.7%{opacity:1}90%{opacity:1;transform:translateY(-12px)}96%,100%{opacity:0;transform:translateY(-16px)}}
@keyframes ibtb{0%,78.7%{opacity:0;transform:translateY(0)}80.7%{opacity:1}94%{opacity:1;transform:translateY(-12px)}98%,100%{opacity:0;transform:translateY(-16px)}}
@keyframes ibtc{0%,84.5%{opacity:0;transform:translateY(0)}86.5%{opacity:1}97%{opacity:1;transform:translateY(-10px)}99.5%,100%{opacity:0;transform:translateY(-12px)}}
.mcell{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.mp1,.mp2{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100 100;animation:imz 8s ease-in-out infinite}

.mp2{stroke:hsl(var(--h) var(--chip-s) var(--chip-bg-l));stroke-width:19}
@keyframes imz{0%,6%{stroke-dashoffset:100;opacity:1}62%,86%{stroke-dashoffset:0;opacity:1}94%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:100;opacity:0}}
.marr{fill:hsl(var(--h) 75% var(--chip-bd-l))}

@media (prefers-reduced-motion:reduce){.ibx.ex{display:none}}
.ieqs{display:grid;gap:10px;justify-items:center}

.itiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:300px}
.itile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:20px;border:2px solid var(--line);background:var(--surface);box-shadow:0 3px 0 var(--line);font-family:var(--f-display);font-weight:700;animation:ipop .5s both;animation-delay:calc(.15s + var(--k)*.15s)}

.icard .av svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.icard .pname{font-family:var(--f-display);font-weight:700}
.ibar{grid-column:1/-1;height:10px;border-radius:6px;background:var(--line);overflow:hidden}

@keyframes ifin{from{opacity:0}to{opacity:1}}

.deco{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:4px 0 18px}

.deco span:nth-child(1){transform:rotate(-3deg)}

.field{display:flex;gap:10px}
input[type=text]{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;min-height:48px;width:100%;min-width:0}

/* Setup */
.panel{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:16px;margin:0 0 14px}
.seg{display:grid;gap:8px}
.seg.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg.modes .opt{padding-left:4px;padding-right:4px}
@media (max-width:380px){.seg.modes{gap:6px}.seg.modes .opt{font-size:.86rem;padding-left:2px;padding-right:2px}}
@media (max-width:340px){.seg.modes .opt{font-size:.76rem}}
.seg.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.seg.c5{grid-template-columns:repeat(5,minmax(0,1fr))}
.seg.c6{grid-template-columns:repeat(6,minmax(0,1fr))}
.seg.c6 .opt{grid-column:span 2}
.seg.c6 .opt:nth-child(n+4){grid-column:span 3}
.eqbr{flex-basis:100%;height:0}
.eqnote{font-family:var(--f-body);font-weight:700;font-size:.95rem;line-height:1.3;color:var(--ink-soft);text-align:center}
.eqnote.full{flex-basis:100%}
.opt{min-height:52px;padding:8px 6px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:1rem;line-height:1.15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.opt small{font-family:var(--f-body);font-weight:700;font-size:.8rem;color:var(--ink-soft)}
.opt[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-tint);box-shadow:inset 0 0 0 1.5px var(--primary)}
.opt.wide{grid-column:1/-1}
.opt.span3{grid-column:span 3}
.opt.span5{grid-column:span 5}
.seg.c5 .opt{padding-left:2px;padding-right:2px}
.opt.inf svg{width:34px;height:34px}
.eqopt{font-size:.98rem;white-space:nowrap}
.tgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.tchip{aspect-ratio:1;max-width:100%;border-radius:18px;border:2px dashed var(--line);background:var(--surface);color:var(--ink-soft);font-family:var(--f-display);font-weight:700;font-size:1.5rem;padding:0}
.tchip[aria-pressed="true"]{border-style:solid;border-color:hsl(var(--h) 75% var(--chip-bd-l));background:hsl(var(--h) var(--chip-s) var(--chip-bg-l));color:var(--ink);box-shadow:0 3px 0 hsl(var(--h) 70% var(--chip-bd-l))}
.tools{display:flex;gap:8px;margin-top:10px}
.tools.otools{flex-wrap:wrap}
.startbar{position:sticky;bottom:0;padding:14px 0 calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 72%,transparent)}

/* Session */
.sess{display:grid;gap:12px}
.sess-top{display:grid;grid-template-columns:auto 1fr 44px 44px;align-items:center;gap:10px}
.count{text-align:center;font-family:var(--f-display);font-weight:600;font-size:1.05rem;line-height:1.2}
.count small{display:block;font-family:var(--f-body);font-weight:700;font-size:.8rem;color:var(--ink-soft)}
.prog{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--primary);border-radius:99px;transition:width .25s}
.timerrow{display:flex;align-items:center;gap:10px}
.timer{flex:1;height:16px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--accent);border-radius:99px;transition:width .1s linear}
.timer.low i{background:var(--bad)}
.ttxt{min-width:3.2em;text-align:right;font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums}
.eq{background:var(--surface);border:3px solid var(--line);border-radius:28px;padding:18px 10px;display:flex;justify-content:center;align-items:center;gap:.28em;flex-wrap:wrap;font-family:var(--f-display);font-weight:700;font-size:clamp(2.3rem,11.5vw,4rem);line-height:1.1;min-height:124px;transition:border-color .15s,background .15s}
.eq .op{color:var(--ink-soft)}
.eq.ok{border-color:var(--good);background:var(--good-bg);animation:pop .3s}
.eq.bad{border-color:var(--bad);background:var(--bad-bg)}
.eq.rev{border-color:var(--accent);background:var(--accent-bg)}
.eq.retry{border-color:var(--bad);animation:shake .4s}
.slot{display:inline-block;min-width:1.4em;text-align:center;border-bottom:.07em dashed var(--ink-soft);font-variant-numeric:tabular-nums}
.slot.empty{color:var(--ink-soft)}
.slot.typed{color:var(--primary)}
.slot.ans{color:var(--good);border-bottom-style:solid;border-bottom-color:var(--good)}
.slot.wrong{color:var(--bad)}
button.slot{font:inherit;color:inherit;background:none;border-width:0 0 .07em;border-style:dashed;border-color:var(--ink-soft);padding:0 .1em;min-width:1.5em;cursor:pointer;border-radius:.15em .15em 0 0}
button.slot.empty{color:var(--ink-soft)}
button.slot.typed{color:var(--primary)}
button.slot.cur{background:var(--primary-tint);border-bottom-style:solid;border-bottom-color:var(--primary)}
.choices.fm{grid-template-columns:1fr}
.choices.fm .choice{min-height:64px;font-size:1.9rem}
.d-grid.fm .dval{font-size:clamp(1.3rem,6vw,1.9rem)}
.msg{min-height:2.7em;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:1.1rem}
.msg.good{color:var(--good)} .msg.bad{color:var(--bad)} .msg.info{color:var(--ink)}
.actions{display:flex;gap:10px;justify-content:center;min-height:48px}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pad[data-locked="1"] .key{opacity:.55;pointer-events:none}
.key{height:clamp(54px,8.6vh,70px);border-radius:18px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--f-display);font-weight:700;font-size:1.7rem;box-shadow:0 4px 0 var(--line);padding:0;transition:transform .06s,box-shadow .06s}
.key:active{transform:translateY(4px);box-shadow:0 0 0 var(--line)}
.key.del{background:var(--surface-2);font-size:1.3rem}
.key.okk{background:var(--primary);border-color:var(--primary);color:var(--on-primary);box-shadow:0 4px 0 var(--primary-deep);font-size:1.3rem}
.key.okk:active{box-shadow:0 0 0 var(--primary-deep)}

.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.choices[data-locked="1"] .choice{pointer-events:none}
.choice{min-height:clamp(88px,16vh,120px);border-radius:22px;border:3px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--f-display);font-weight:700;font-size:2.2rem;box-shadow:0 5px 0 var(--line);padding:0;font-variant-numeric:tabular-nums;transition:transform .06s,box-shadow .06s}
.choice:active:not(:disabled){transform:translateY(5px);box-shadow:0 0 0 var(--line)}
.choice.off{opacity:.4;text-decoration:line-through;box-shadow:none}
.choice.good{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.choice.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}

/* Summary */
.sum{text-align:center}
.bigscore{font-family:var(--f-display);font-weight:700;font-size:clamp(3.5rem,18vw,5rem);line-height:1;margin-top:6px}
.bigscore small{font-size:.45em;color:var(--ink-soft)}
.stars{display:flex;justify-content:center;gap:8px;margin:12px 0 8px}
.stars svg{width:48px;height:48px;stroke-linejoin:round}
.star-on{fill:var(--accent);stroke:var(--accent)}
.star-off{fill:none;stroke:var(--line);stroke-width:2}
.sum .msgbig{font-family:var(--f-display);font-weight:600;font-size:1.3rem;text-wrap:balance}
.meta{color:var(--ink-soft);font-weight:700;font-size:.9rem;margin:6px 0 18px}
.sum .panel{text-align:left}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.eqs{font-family:var(--f-display);font-weight:700;font-size:1.2rem}
.given{color:var(--ink-soft);font-weight:700;font-size:.9rem;text-align:right}

/* Stats */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 14px}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 6px;text-align:center}
.tile b{display:block;font-family:var(--f-display);font-size:1.7rem;line-height:1.1}
.tile span{font-size:.78rem;font-weight:700;color:var(--ink-soft)}
.hm{display:grid;grid-template-columns:1.3rem repeat(10,minmax(0,1fr));gap:3px}
/* Téléphones étroits : la grille déborde dans la marge du cadre pour agrandir les cases (cible tactile). */
@media (max-width:420px){.hm{margin:0 -9px;gap:2px;grid-template-columns:1rem repeat(10,minmax(0,1fr))}}
.hmh{display:grid;place-items:center;font-size:.72rem;font-weight:800;color:var(--ink-soft)}

.hc{aspect-ratio:1;border:0;border-radius:7px;color:var(--ink);font-weight:800;font-size:.7rem;padding:0;font-variant-numeric:tabular-nums}
.hc[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:1px}
.cvtabs{margin-bottom:12px}
.cvchips{display:grid;grid-template-columns:1.9fr repeat(10,minmax(0,1fr));gap:3px;margin-bottom:10px}
.cvchips .tchip{aspect-ratio:auto;height:34px;border-radius:10px;font-size:.95rem;border-width:2px}
.cvchips .tchip.cvg{font-size:.72rem;letter-spacing:-.2px}
.cvchips .tchip.cvg[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2);box-shadow:0 3px 0 var(--ink)}
.cvwrap{border-radius:14px;overflow:hidden;border:2px solid var(--line);background:var(--surface);margin-bottom:10px}
.cvsvg{display:block;width:100%;height:250px;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.cvb{fill-opacity:.55}
.cvb.lv-low{fill:var(--lv-low)} .cvb.lv-mid{fill:var(--lv-mid)} .cvb.lv-high{fill:var(--lv-high)} .cvb.lv-top{fill:var(--lv-top)}
.cvgrid{stroke:var(--ink-soft);stroke-opacity:.25;stroke-width:1}
.cvgrid.v{stroke-dasharray:2 4}
.cvt{font-size:10.5px;font-weight:800;fill:var(--ink-soft);font-family:var(--f-body)}
.cvl{fill:none;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.cvl.g{stroke-width:3.6}
.cvcur{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 3}
.cvrange .opt{min-height:38px;padding:4px 2px;font-size:.8rem}
.lv-new{background:var(--lv-new)} .lv-low{background:var(--lv-low)} .lv-mid{background:var(--lv-mid)} .lv-high{background:var(--lv-high)} .lv-top{background:var(--lv-top)}
.hc.lv-new{box-shadow:inset 0 0 0 1.5px var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:.8rem;font-weight:700;color:var(--ink-soft)}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg i{width:14px;height:14px;border-radius:4px;display:inline-block;box-shadow:inset 0 0 0 1.5px var(--line)}
.detail{margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--surface-2);font-weight:600;min-height:3.4em}
.tb{display:grid;grid-template-columns:2rem minmax(0,1fr) 5.5rem;align-items:center;gap:10px;margin:7px 0}
.tn{font-family:var(--f-display);font-size:1.15rem;text-align:center}
.tb .sub{margin-top:4px;font-size:.78rem;font-weight:700;color:var(--ink-soft)}
.hint.top{margin:0 0 8px}
.why{color:var(--ink-soft);font-weight:700;font-size:.85rem}
.why.nw,.given.nw{white-space:nowrap}
.row.wk{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;row-gap:2px;align-items:center}
.row.wk .why{min-width:0}
.row.wk .given{font-size:.85rem}
.wklist{overflow-y:auto;overflow-x:hidden;padding-right:8px;margin-right:-8px;scrollbar-width:thin}
.wklist:focus-visible{outline:2px solid var(--focus,currentColor);outline-offset:2px;border-radius:8px}
.mut{color:var(--ink-soft);font-weight:700}
.bar{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:99px}
.tv{font-weight:800;font-size:.9rem;text-align:right;font-variant-numeric:tabular-nums}
.tv small{color:var(--ink-soft);font-weight:700}
.empty{color:var(--ink-soft);font-weight:600}

/* Classement */
.rk h3{font-family:var(--f-display);font-weight:600;font-size:1rem;margin:18px 0 8px}
.hc.rk,.rkdot{--rk-l:calc(var(--rl,68%)*(1 - var(--dk)) + var(--rd,36%)*var(--dk))}
.hc.rk{background:hsl(var(--h) var(--rk-s) var(--rk-l));box-shadow:inset 0 0 0 2px hsl(var(--h) 80% var(--rk-ring-l))}
.lg i.rkdot{background:hsl(var(--h) var(--rk-s) var(--rk-l));box-shadow:inset 0 0 0 2px hsl(var(--h) 80% var(--rk-ring-l))}
.rkl{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.seg.join{display:flex;gap:0;border:2px solid var(--line);border-radius:99px;overflow:hidden;background:var(--surface)}
.seg.join .opt{flex:1;min-height:36px;padding:0 8px;border:0;border-radius:0;font-size:.95rem;background:transparent}
.seg.join.cjoin{border-radius:16px}
.seg.join.cjoin .opt{min-height:44px;font-family:var(--f-display);font-weight:600;font-size:1.05rem}
.seg.join .opt+.opt{border-left:2px solid var(--line)}
.seg.join .opt[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);box-shadow:none}
.rrl{list-style:none;margin:0;padding:0}
.rr{display:grid;grid-template-columns:1.6em minmax(0,1.2fr) minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.rr:last-child{border-bottom:0}
.rn{color:var(--ink-soft);font-weight:800;font-size:.8rem;text-align:center}
.rq{font-family:var(--f-display);font-weight:700;font-size:1.1rem;white-space:nowrap}
.ra{display:flex;flex-direction:column;font-weight:800;font-size:.9rem;min-width:0}
.rv.good{color:var(--good)} .rv.bad{color:var(--bad)}
.ra .rv:not(.good):not(.bad){color:var(--ink-soft);font-weight:700;font-size:.78rem}
.rt{font-family:var(--f-display);font-weight:600;font-variant-numeric:tabular-nums;text-align:right;font-size:.95rem}
.tt-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);margin-top:12px}
.tt-col{min-width:0;padding:0 8px 0 0}
.tt-col+.tt-col{padding:0 0 0 8px;border-left:3px dashed var(--line)}
.tt-col h3{margin:0 0 8px;text-align:center}
.tt-col .rkl{margin-top:0}
.tt-col .rkl li{gap:6px;padding:6px;min-width:0}
.tt-col .rkl{grid-template-columns:minmax(0,1fr)}
@media (max-width:360px){.tt-col .rkdot{display:none}}
.rkn.g1{background:var(--gold);border-radius:8px;color:var(--ink)}
.rkn.g2{background:var(--silver);border-radius:8px;color:var(--ink)}
.rkn.g3{background:var(--bronze);border-radius:8px;color:var(--ink)}
#balrk .rkl{grid-template-columns:minmax(0,1fr)}
#balrk .rkl li{min-width:0}
@media (max-width:360px){#balrk .rkdot{display:none}#balrk .rkpct{font-size:.95rem}}
#balrk .rkname{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#balrk .rkpct{flex:none}
.rkl li{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:12px;background:var(--surface)}
.rkn{width:1.4em;flex:none;text-align:center;font-family:var(--f-display);font-weight:700;color:var(--ink-soft)}
.rkdot{display:inline-block;flex:none;width:16px;height:16px;border-radius:5px;background:hsl(var(--h) var(--rk-s) var(--rk-l));box-shadow:inset 0 0 0 2px hsl(var(--h) 80% var(--rk-ring-l))}
.rkname{flex:1;min-width:0;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rkname small{display:block;font-weight:700;font-size:.78rem;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis}
.rkpct{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.detail .rkl{margin-top:8px}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end;margin:8px 0 4px}
.pod{display:grid;justify-items:center;gap:4px;min-width:0}
.pod .pname{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--f-display);font-weight:600;font-size:.95rem}
.pod .pscore{font-weight:800;font-size:.85rem;color:var(--ink-soft)}
.pod .step{width:100%;display:grid;place-items:center;border-radius:14px 14px 0 0;font-family:var(--f-display);font-weight:700;font-size:1.8rem;color:var(--ink)}
.pod.p1 .step{height:100px;background:var(--gold)}
.pod.p2 .step{height:76px;background:var(--silver)}
.pod.p3 .step{height:58px;background:var(--bronze)}
.pod.p1 .av{width:60px;height:60px;font-size:1.7rem}
.pod.none .step{background:transparent;border:2px dashed var(--line);border-bottom:0;color:var(--ink-soft)}
.pod.none .av.ghost{background:transparent;border:2px dashed var(--line);color:var(--ink-soft)}

/* Dialogs */
.overlay{position:fixed;inset:0;background:rgba(20,18,58,.6);display:flex;align-items:flex-end;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:50}
.dlg{background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:24px;width:100%;max-width:520px;max-height:100%;overflow:auto;padding:20px}
.dlg p{margin-top:8px}
.remind{display:grid;gap:8px;margin:0 0 12px}
.rm{display:grid;gap:8px;padding:12px 14px;border-radius:18px;border:2px solid var(--accent);background:var(--accent-bg);font-weight:800}
.rm .btns{display:flex;gap:8px;flex-wrap:wrap}
.dlg input[type=time],.dlg input[type=date]{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 14px;min-height:48px;width:100%}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.days .opt{min-height:46px;padding:4px 0;font-size:.85rem}
.opt.dif{flex-direction:row;gap:4px;white-space:nowrap;padding-left:4px;padding-right:4px;font-size:.88rem}
.opt.dif small{font-size:inherit;font-weight:inherit;font-family:inherit;color:inherit}
/* Très petit écran : la durée passe en petit sous le niveau. */
@media (max-width:340px){.opt.dif{flex-direction:column;gap:2px}.opt.dif small{font-size:.75rem;color:var(--ink-soft)}}
.tipbtn{position:relative;display:inline-grid;place-items:center;width:24px;height:24px;margin-left:6px;vertical-align:middle;border-radius:50%;border:2px solid var(--primary);background:var(--primary-tint);color:var(--ink);font-family:var(--f-display);font-weight:700;font-size:.72rem;line-height:1;padding:0;font-style:italic}
/* Zone tactile plus grande que le bouton visible (36 px). */
.tipbtn::after{content:"";position:absolute;inset:-6px}
.tip{position:relative;margin:0 0 8px;padding:6px 10px;border-radius:12px;background:var(--surface-2);border:2px solid var(--line);font-size:.78rem;font-weight:600;line-height:1.3}
.tip::before{content:"";position:absolute;top:-8px;left:var(--ar,109px);width:12px;height:12px;background:var(--surface-2);border-left:2px solid var(--line);border-top:2px solid var(--line);transform:rotate(45deg)}
.sh{font-family:var(--f-display);font-weight:600;font-size:1rem;margin:16px 0 8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:800;z-index:60;max-width:90vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}

@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(.97)}55%{transform:scale(1.025)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Petits écrans (320 à 380 px) : boutons des leçons et astuces d'au moins 24 px de large. */
@media (max-width:380px){.asti-b{padding-left:10px;padding-right:10px}.tgrid.tsgrid{gap:2px}}
@media (max-width:340px){.tsrow{grid-template-columns:minmax(0,1fr);gap:4px}.tsrow .tslab{min-width:0}}

/* DÉMO SITE WEB */
.pbtn,.sndbtn,#topback,#topconseil,[data-act="stats"],[data-act="rank"]{display:none!important}
